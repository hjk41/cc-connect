name: Upstream Sync

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'hjk41/cc-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - name: Prepare upstream merge and pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_BRANCH: automation/upstream-sync
        run: bash .github/maintenance/upstream-sync.sh
